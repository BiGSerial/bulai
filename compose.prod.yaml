# BULA-IA — produção (VPS KingHost). Independente de compose.yaml (desenvolvimento).
#
# Este arquivo é a FRONTEIRA DE CONFIANÇA da implantação: uma cópia aprovada fica em /opt/bulai/trusted (somente root)
# e é a única usada pelo script de deploy. Imagens são referenciadas por digest e vêm do pipeline; nada é construído
# na VPS. Variáveis obrigatórias (definidas pelo script de deploy): APP_IMAGE, WEB_IMAGE, OCR_IMAGE, LOCAL_AI_IMAGE.
#
# Rede/portas: somente o Nginx publica porta, em 127.0.0.1:8080 (o Caddy do host faz o TLS e encaminha para lá).
# Nginx e PHP-FPM conversam por um socket Unix (diretório 2750 10010:10030 criado pelo instalador): não há FastCGI em rede.
# UIDs/GIDs dos containers (10001 ocr, 10002 local-ai, 10010 app/worker, 10020 postgres, 10030 nginx) são ALTOS de propósito:
# nenhum deles pode coincidir com contas do host (ex.: 999=caddy, 101=messagebus/lxd na KingHost), pois os bind mounts
# `/srv/bulai/shared/*` seriam acessíveis a essas contas. O instalador recusa instalar se algum já existir no host.
# Redes internas, sem saída para a internet e sem portas publicadas: `db` (app/worker ↔ postgres) e `ai` (app/worker ↔ OCR/IA).
# OCR e IA processam entradas não confiáveis (PDFs) e por isso NÃO compartilham rede com o PostgreSQL.
# A rede externa `bulai-internal` NÃO é usada: ela é compartilhada com contêineres desconhecidos e um socket dispensa rede.

name: bulai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-php-app: &php-app
  image: ${APP_IMAGE:?APP_IMAGE é obrigatório}
  env_file:
    - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/env/app.env
  environment: &php-env
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    CACHE_STORE: database
    DOCUMENT_OCR_ENABLED: "true"
    DOCUMENT_OCR_DRIVER: http
    DOCUMENT_OCR_URL: http://document-ocr:8000
    DOCUMENT_CLASSIFIER_DRIVER: llamafile
    LOCAL_AI_URL: http://local-ai:8080
  <<: *hardening
  read_only: true
  logging: *default-logging
  restart: unless-stopped
  networks:
    - db
    - ai
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /var/www/html/bootstrap/cache:size=16m,uid=10010,gid=10010,mode=0700
    - /var/www/html/storage/framework:size=128m,uid=10010,gid=10010,mode=0700
  volumes:
    - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/storage:/var/www/html/storage/app

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE é obrigatório}
    # Nginx sem root com UID/GID próprios (10030), sem relação com contas do host; o socket e o cache pertencem a esse uid.
    user: "10030:10030"
    <<: *hardening
    read_only: true
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
    tmpfs:
      - /tmp:size=16m
    volumes:
      # Buffer de corpos grandes (PDFs) em DISCO, em diretório do host pertencente ao uid 10030 (não um volume nomeado,
      # que herdaria o dono 101 da imagem).
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/web-cache:/var/cache/nginx
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/run:/run/php
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s

  app:
    <<: *php-app
    command: ["php-fpm", "--nodaemonize"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/storage:/var/www/html/storage/app
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/run:/run/php
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s

  worker:
    <<: *php-app
    # Um único worker, um job por vez: OCR e IA nunca rodam em paralelo (RAM da VPS). O timeout cobre OCR (300 s) + IA (90 s) + margem;
    # DB_QUEUE_RETRY_AFTER (app.env) deve ser maior que este valor.
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--timeout=450", "--max-jobs=200", "--max-time=3600", "--memory=400"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -lE 'queue[:]work' /proc/[0-9]*/cmdline >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2.0
    pids_limit: 256
    # Deixa o job em andamento terminar antes de substituir o container.
    stop_grace_period: 480s
    stop_signal: SIGTERM

  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    # UID/GID 10020 (não o 999 padrão da imagem, que no host é o caddy): o diretório de dados pertence a 10020:10020 (instalador).
    # A imagem só inicializa o banco se o uid existir no /etc/passwd do container: arquivos mínimos montados somente leitura.
    user: "10020:10020"
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/env/postgres.env
    environment:
      POSTGRES_DB: bulai
      BULAI_DB_USER: bulai
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=2000
    volumes:
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/postgres:/var/lib/postgresql/data
      - ./docker/production/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/production/postgres/passwd:/etc/passwd:ro
      - ./docker/production/postgres/group:/etc/group:ro
    tmpfs:
      - /var/run/postgresql:uid=10020,gid=10020,mode=0775
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d bulai"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    shm_size: 128m
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2.0
    pids_limit: 200
    oom_score_adj: -500
    stop_grace_period: 60s

  document-ocr:
    image: ${OCR_IMAGE:?OCR_IMAGE é obrigatório}
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/env/ocr.env
    environment:
      OCR_ENGINE: paddleocr
      OCR_LANGUAGE: pt
      OCR_MAX_CONCURRENCY: "1"
      OMP_NUM_THREADS: "2"
    networks:
      - ai
    tmpfs:
      - /tmp:size=256m,uid=10001,gid=10001,mode=0700
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    oom_score_adj: 500
    stop_grace_period: 30s

  local-ai:
    # Classificador auxiliar da ingestão (llamafile + Qwen2.5-1.5B, CPU). NÃO é a IA principal do RAG.
    image: ${LOCAL_AI_IMAGE:?LOCAL_AI_IMAGE é obrigatório}
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOCAL_AI_MODEL_PATH: /models
      LOCAL_AI_MODEL_FILENAME: ${LOCAL_AI_MODEL_FILENAME:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      LOCAL_AI_MODEL_NAME: ${LOCAL_AI_MODEL_NAME:-qwen2.5-1.5b-instruct}
      LOCAL_AI_THREADS: "3"
      LOCAL_AI_CONTEXT: "2048"
      LOCAL_AI_REQUEST_TIMEOUT: "120"
    volumes:
      # O modelo fica FORA das releases e do Git; instalado/validado (SHA-256) por `bulai-deploy ensure-model`.
      - ${BULAI_SHARED_DIR:-/srv/bulai/shared}/models:/models:ro
    networks:
      - ai
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    mem_limit: 2300m
    memswap_limit: 2300m
    cpus: 3.0
    pids_limit: 256
    oom_score_adj: 500
    stop_grace_period: 30s

networks:
  # Publicação da porta 127.0.0.1:8080 (somente o Nginx está aqui).
  edge: {}
  # Banco de dados: só app/worker e postgres; sem saída para a internet.
  db:
    internal: true
  # OCR e IA local: só app/worker e os dois serviços; sem saída para a internet e sem acesso ao banco.
  ai:
    internal: true

