# Nginx interno (atrás do Caddy do host, em 127.0.0.1:8080). O TLS termina no Caddy, que (a) valida que a requisição veio
# do Cloudflare e (b) envia o IP real em X-Real-IP e o esquema em X-Forwarded-Proto.
# Este Nginx só aceita esses cabeçalhos da rede de bridge do Docker (o Caddy chega a ele pelo gateway da bridge, pois a
# porta só está publicada em 127.0.0.1). Assim o PHP recebe REMOTE_ADDR e HTTPS corretos sem precisar confiar em
# X-Forwarded-* de proxies (TRUSTED_PROXIES continua disponível no Laravel para outras topologias).
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive off;

map $http_x_forwarded_proto $bulai_https {
    default "";
    "https" "on";
}

server_tokens off;

# Envio de PDFs (admin e API interna): lote de até 100 MB (KNOWLEDGE_INGESTION_MAX_BATCH_KILOBYTES) + overhead multipart.
# Só estas rotas aceitam corpo grande (o restante fica em 2 MB).
client_max_body_size 2m;   # padrão restrito; os endpoints de envio de PDFs elevam o limite abaixo
client_body_timeout 120s;
client_header_timeout 15s;
send_timeout 60s;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

upstream bulai_php {
    server unix:/run/php/bulai.sock;
    keepalive 8;
}

server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Cabeçalhos de segurança básicos (CSP fica a cargo da aplicação para não quebrar o Livewire).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Healthcheck do próprio Nginx (não depende do PHP).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets compilados têm hash no nome: cache longo e imutável.
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Estáticos públicos (marca, ícones). O resto vai ao Laravel.
    location ~* ^/(brand/.+|favicon\.ico|robots\.txt|manifest\.webmanifest|sw\.js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Nunca servir dotfiles; nenhum outro *.php é executado (só o front controller abaixo).
    location ~ /\.(?!well-known) { return 404; }
    location ~ \.php$ { return 404; }

    # Rotas de envio de PDFs: Livewire (upload temporário do admin) e API interna de ingestão.
    location ~ ^/(livewire-[0-9a-f]+/upload-file|api/internal/knowledge/) {
        client_max_body_size 110m;
        include fastcgi_params_bulai;   # sem redirecionamento interno: o limite acima vale para esta requisição
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params_bulai;
    }
}
