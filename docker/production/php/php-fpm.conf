; Pool único do PHP-FPM. Roda como o usuário não privilegiado da imagem (bulai, uid 10010), por isso sem user/group.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; Socket Unix em diretório compartilhado só com o Nginx (grupo 101, setgid, modo 0660): o FastCGI nunca fica exposto em rede.
listen = /run/php/bulai.sock
listen.mode = 0660
clear_env = no                ; as variáveis do container (DB_*, APP_KEY…) precisam chegar aos workers
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Dimensionado para 8 GB de RAM compartilhados com PostgreSQL, OCR e IA: poucos workers, reciclados com frequência.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 130s

; Usado somente pelo healthcheck do container (via o socket).
ping.path = /fpm-ping
ping.response = pong
