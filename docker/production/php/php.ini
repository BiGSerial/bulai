; Ajustes de produção do BULA-IA (carregado depois dos padrões da imagem).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 512M
max_execution_time = 120
; Envio administrativo de PDFs (KNOWLEDGE_INGESTION_MAX_BATCH_KILOBYTES = 100 MB por lote).
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 50
date.timezone = UTC

; Imagem imutável: o código não muda em execução, então não há revalidação de timestamps.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Uploads temporários em disco (volume de storage/app), não em tmpfs/RAM.
upload_tmp_dir = /var/www/html/storage/app/php-uploads
