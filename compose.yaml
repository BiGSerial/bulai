services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bulai
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Fila, cache e sessões (QUEUE_CONNECTION/CACHE_STORE/SESSION_DRIVER=redis). AOF mantém jobs e sessões após reiniciar.
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  document-ocr:
    build: ./services/document-ocr
    environment:
      OCR_ENGINE: paddleocr
      TZ: ${TZ:-America/Sao_Paulo}
      OCR_API_TOKEN: ${DOCUMENT_OCR_TOKEN:-}
      OCR_LANGUAGE: pt
    ports:
      - "127.0.0.1:${DOCUMENT_OCR_HOST_PORT:-8090}:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
    restart: unless-stopped

  local-ai:
    # Classificador local (llamafile) usado apenas para resolver ambiguidades da ingestão.
    # Não é a IA principal do aplicativo. CPU-only; modelo instalado por scripts/install-local-model.sh.
    build: ./services/local-ai
    environment:
      LOCAL_AI_MODEL_PATH: /models
      LOCAL_AI_MODEL_FILENAME: ${LOCAL_AI_MODEL_FILENAME:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      LOCAL_AI_MODEL_NAME: ${LOCAL_AI_MODEL_NAME:-qwen2.5-1.5b-instruct}
      TZ: ${TZ:-America/Sao_Paulo}
      LOCAL_AI_THREADS: ${LOCAL_AI_THREADS:-4}
      LOCAL_AI_CONTEXT: ${LOCAL_AI_CONTEXT:-8192}
      LOCAL_AI_REQUEST_TIMEOUT: ${LOCAL_AI_REQUEST_TIMEOUT:-120}
      LOCAL_AI_ADMIN_TOKEN: ${LOCAL_AI_ADMIN_TOKEN:-}
    volumes:
      - ./services/local-ai/models:/models:ro
    ports:
      - "127.0.0.1:${LOCAL_AI_HOST_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    restart: unless-stopped

  embeddings:
    # Embeddings do RAG vetorial/híbrido (bge-m3 via llamafiler, CPU). Mesma imagem do local-ai em LOCAL_AI_MODE=embedding;
    # expõe /v1/embeddings (OpenAI-compatível) para AI_EMBEDDING_DRIVER=openai_compatible. Modelo: scripts/install-embedding-model.sh.
    build: ./services/local-ai
    environment:
      LOCAL_AI_MODE: embedding
      LOCAL_AI_MODEL_PATH: /models
      LOCAL_AI_MODEL_FILENAME: ${EMBEDDINGS_MODEL_FILENAME:-bge-m3-Q8_0.gguf}
      LOCAL_AI_MODEL_NAME: ${EMBEDDINGS_MODEL_NAME:-bge-m3}
      LOCAL_AI_THREADS: ${EMBEDDINGS_THREADS:-2}
      # bge-m3 aceita 8192 tokens; os chunks têm no máximo ~2.600 caracteres, 2048 basta e economiza RAM.
      LOCAL_AI_CONTEXT: ${EMBEDDINGS_CONTEXT:-2048}
      # Limite por texto no llamafiler; AI_EMBEDDING_TIMEOUT (.env) cobre o lote inteiro e deve ser >= este valor.
      LOCAL_AI_REQUEST_TIMEOUT: ${EMBEDDINGS_REQUEST_TIMEOUT:-180}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./services/local-ai/models:/models:ro
    ports:
      - "127.0.0.1:${EMBEDDINGS_HOST_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500m
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
