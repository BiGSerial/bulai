services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bulai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
